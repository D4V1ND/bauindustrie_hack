<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Needle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect width='20' height='20' rx='4.5' fill='%23f0542b'/%3E%3Cpath fill-rule='evenodd' fill='%230a0a0a' transform='rotate(38 10 10)' d='M8.6 2.6A1.4 1.4 0 0 1 11.4 2.6L11.4 8.2L10 19.2L8.6 8.2ZM9.5 2.3H10.5V6.6H9.5Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Needle (formerly LV Mastermind) V2. Paper and ink, hairlines, square corners, thin display type with
   mono annotations, one warm accent. Important actions get their own motion. */
:root{
 --paper:#f4f4f0;--paper-2:#ebeae4;--paper-3:#e2e1d9;--card:#fbfaf7;
 --ink:#0a0a0a;--ink-2:#525252;--ink-3:#8b8a84;
 --line:rgba(10,10,10,.12);--line-2:rgba(10,10,10,.26);
 --signal:#f0542b;--signal-bg:rgba(240,84,43,.08);
 --ok:#17663f;--ok-bg:rgba(23,102,63,.09);--on-ok:#fff;
 --warn:#9a5d00;--warn-bg:rgba(186,121,0,.11);
 --bad:#a3231a;--bad-bg:rgba(163,35,26,.08);
 --glow-1:rgba(247,206,92,.5);--glow-2:rgba(246,160,120,.38);--glow-3:rgba(240,150,165,.28);
 --shadow:0 24px 60px -20px rgba(40,32,10,.3);
 --tm-tb:#3e4a5b;--tm-lw:#5a7262;--tm-ma:#86634a;--tm-sk:#a8792f;--on-av:#fff;
 --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
 --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
 color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
 font-variant-numeric:tabular-nums;overflow-x:hidden;transition:background-color .4s var(--ease),color .4s var(--ease)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
::selection{background:var(--signal);color:#fff}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;font-weight:400}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
svg.i{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.glow{position:fixed;inset:-20vh -20vw;z-index:-1;pointer-events:none;
 background:radial-gradient(34% 40% at 16% 14%,var(--glow-1),transparent 70%),radial-gradient(28% 36% at 86% 22%,var(--glow-3),transparent 70%),radial-gradient(38% 44% at 64% 90%,var(--glow-2),transparent 72%);
 filter:blur(10px);animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(3vw,-2vh,0) scale(1.05)}}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 84%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1360px;margin:0 auto;padding:12px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:14px;min-width:0}
.wm{display:inline-flex;align-items:baseline}
.wm-n{width:.31em;height:.93em;margin:0 .01em -.04em .02em;fill:var(--signal);overflow:visible;transform-origin:30% 98%;animation:wmswing 1.1s var(--spring) .2s both,wmtwitch 7s var(--ease) 3s infinite}
@keyframes wmswing{from{transform:rotate(-55deg)}to{transform:rotate(0)}}
@keyframes wmtwitch{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-9deg)}96%{transform:rotate(5deg)}}
.brand-b:hover .wm-n{animation:wmswing .9s var(--spring)}
@media (prefers-reduced-motion:reduce){.wm-n{animation:none!important}}
.brand .wm{font-weight:600;letter-spacing:-.03em;font-size:26px}
.crumb{color:var(--ink-3)}
.crumb a{color:var(--ink-2);text-decoration:none}.crumb a:hover{color:var(--signal)}
.top-r{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;height:36px;border:1px solid var(--line-2);padding:0 10px;width:270px;max-width:100%;color:var(--ink-3);background:color-mix(in srgb,var(--card) 70%,transparent);transition:border-color .16s,box-shadow .16s}
.search:focus-within{border-color:var(--ink);box-shadow:3px 3px 0 var(--signal)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:13px;color:var(--ink)}
.kbd{font:500 10px/1 var(--mono);border:1px solid var(--line-2);padding:3px 5px;color:var(--ink-3)}
.team{display:flex}
.av{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;color:var(--on-av);font:500 10px/1 var(--mono);letter-spacing:.02em;flex:none;border:0;padding:0}
.team .av{border:2px solid var(--paper);margin-left:-5px;width:30px;height:30px;transition:transform .25s var(--spring)}
.team .av:hover{transform:translateY(-3px)}
.bell{position:relative;width:36px;height:36px;border:1px solid var(--line-2);background:transparent;display:inline-flex;align-items:center;justify-content:center;transition:background .16s}
.bell:hover{background:var(--paper-2)}
.bell::after{content:"";position:absolute;top:7px;right:7px;width:6px;height:6px;background:var(--signal);animation:blink 2s infinite}
@keyframes blink{0%,60%,100%{opacity:1}80%{opacity:.2}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:.55rem;height:38px;padding:0 1rem;border:1px solid var(--ink);background:transparent;color:var(--ink);
 font:450 .7rem/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;position:relative;
 transition:background .16s,color .16s,border-color .16s,transform .16s var(--ease),box-shadow .2s}
.btn:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-primary:hover:not(:disabled){background:var(--signal);border-color:var(--signal);color:#fff}
.btn-quiet{border-color:var(--line-2)}
.btn-sm{height:30px;padding:0 .7rem;font-size:.64rem}
.btn .arrow{transition:transform .26s var(--ease)}
.btn:hover .arrow{transform:translateX(4px)}
.btn.on{background:var(--ink);color:var(--paper)}
/* AI button: soft sheen, faster while thinking */
.btn-ai{border-color:var(--line-2);overflow:hidden}
.btn-ai::before{content:"";position:absolute;inset:0;opacity:0;pointer-events:none;
 background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,var(--signal) 28%,transparent) 45%,color-mix(in srgb,var(--glow-1) 80%,transparent) 55%,transparent 70%);background-size:300% 100%;transition:opacity .2s}
.btn-ai:hover::before{opacity:1;animation:sheen 2.6s linear infinite}
.btn-ai.is-thinking{pointer-events:none;border-color:var(--signal)}
.btn-ai.is-thinking::before{opacity:1;animation:sheen 1s linear infinite}
.btn-ai .star{color:var(--signal);transition:transform .52s var(--spring)}
.btn-ai:hover .star{transform:rotate(90deg) scale(1.15)}
.btn-ai.is-thinking .star{animation:spin 1.1s linear infinite}
@keyframes sheen{from{background-position:100% 0}to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
/* The one action that ships the bid: primary ink button, amount after a hairline, slow sheen */
.btn-export{height:40px;padding:0 1.1rem;overflow:hidden;gap:.7rem}
.btn-export .xsep{width:1px;height:16px;background:currentColor;opacity:.28}
.btn-export .xamt{font:500 .8rem/1 var(--sans);letter-spacing:-.005em;text-transform:none}
.btn-export::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.18) 50%,transparent 65%);transform:translateX(-120%);animation:pay-sheen 4.5s ease-in-out infinite;pointer-events:none}
.btn-export:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 14px 30px -14px color-mix(in srgb,var(--signal) 70%,transparent)}
@keyframes pay-sheen{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.lnk{all:unset;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:var(--signal);text-decoration-thickness:1px;text-underline-offset:3px;transition:color .15s}
.lnk:hover{color:var(--signal)}
.lnk:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

/* ---------- layout ---------- */
main{max-width:1360px;margin:0 auto;padding:36px 32px 120px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.eyebrow{display:flex;gap:.9rem;align-items:center;flex-wrap:wrap;color:var(--ink-3)}
.eyebrow .num{color:var(--ink)}
h1{margin:12px 0 0;font-size:clamp(2rem,4.2vw,3.3rem);line-height:1.02;font-weight:300;letter-spacing:-.045em;text-wrap:balance}
.live{display:inline-flex;align-items:center;gap:.5rem;color:var(--ink-2)}
.live i{width:7px;height:7px;background:var(--ok);position:relative}
.live i::after{content:"";position:absolute;inset:0;border:1px solid var(--ok);animation:ping 1.8s var(--ease) infinite}
@keyframes ping{from{transform:scale(1);opacity:1}to{transform:scale(3);opacity:0}}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}

.rise{animation:rise .6s var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* progress strip */
.prog{margin-top:26px;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;padding:14px 18px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 70%,transparent)}
.prog-n{font-size:22px;font-weight:300;letter-spacing:-.03em}
.prog-n b{font-weight:500}
.ticks{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;min-width:0}
.tick-s{height:10px;background:var(--paper-3);position:relative;transition:background .3s}
.tick-s.ok{background:var(--ok)}
.tick-s.bump{animation:bump .6s var(--spring)}
@keyframes bump{0%{transform:scaleY(.4)}60%{transform:scaleY(1.9)}100%{transform:none}}
.deadline{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.deadline b{font-size:22px;font-weight:300;letter-spacing:-.03em}

.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin:18px 0 0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.meta>div{padding:14px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transition:background .2s}
.meta>div:hover{background:var(--card)}
.meta dt{color:var(--ink-3)}
.meta dd{margin:5px 0 0;font-size:14px;font-weight:500}
.meta dd+dd{margin:0;font-size:12px;font-weight:400;color:var(--ink-2)}

.tabs{position:relative;display:flex;gap:4px;margin-top:30px;border-bottom:1px solid var(--line)}
.tab{all:unset;cursor:pointer;padding:12px 14px;display:inline-flex;align-items:center;gap:8px;color:var(--ink-3);font:400 .72rem/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;transition:color .16s}
.tab:hover,.tab.on{color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
.tab-ind{position:absolute;bottom:-1px;height:2px;background:var(--ink);transition:left .4s var(--spring),width .4s var(--spring)}

.grid2{display:flex;flex-wrap:wrap;gap:20px;margin-top:24px}
.card{border:1px solid var(--line);background:color-mix(in srgb,var(--card) 82%,transparent);padding:24px 26px;min-width:0;position:relative;overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.card-h .mono{color:var(--ink-3)}
.card-h .mono b{color:var(--ink);font-weight:400}
.scan::after{content:"";position:absolute;left:0;right:0;height:80px;top:-80px;pointer-events:none;
 background:linear-gradient(transparent,color-mix(in srgb,var(--signal) 14%,transparent),transparent);animation:scan 1.4s var(--ease) infinite}
@keyframes scan{to{top:100%}}

/* [01] cost */
.big{font-size:clamp(2.2rem,4vw,3rem);font-weight:250;letter-spacing:-.05em;line-height:1}
.cost,.bid{display:flex;flex-direction:column}
.costbar{position:relative;margin:72px 0 0}
.costbar .track{display:grid;grid-template-columns:43.4fr 15.8fr 40.8fr;gap:2px;height:12px}
.costbar .track i{display:block;transform-origin:left;animation:grow .8s var(--ease) both}
.costbar .track i:nth-child(1){background:var(--ok);animation-delay:.2s}
.costbar .track i:nth-child(2){background:var(--warn);animation-delay:.35s}
.costbar .track i:nth-child(3){background:var(--bad);animation-delay:.5s}
@keyframes grow{from{transform:scaleX(0)}}
.cb-cap{position:absolute;top:-4px;height:20px;border-left:1px solid var(--ink)}
.pin{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.pin-top{top:-56px;animation:drop .7s var(--spring) .9s both}
.pin-top .lbl{background:var(--ink);color:var(--paper);padding:7px 11px;white-space:nowrap;font:500 .66rem/1 var(--mono);letter-spacing:.07em;text-transform:uppercase}
.pin-top .stem{width:2px;height:52px;background:var(--ink)}
.pin-ai{top:20px;color:var(--signal);animation:lift .7s var(--spring) 1.1s both}
.pin-ai span{font:500 .66rem/1.3 var(--mono);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;margin-top:5px}
.pin-avg{position:absolute;top:-8px;height:28px;border-left:1px dashed var(--ink)}
@keyframes drop{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes lift{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.costends{display:flex;justify-content:space-between;gap:16px;margin-top:48px;font-size:12.5px;color:var(--ink-2)}
.costends b{display:block;font-size:16px;font-weight:500;color:var(--ink);letter-spacing:-.01em;margin-bottom:2px}
.legend{display:flex;gap:8px 20px;flex-wrap:wrap;margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;display:inline-block}
.cost-mid{padding-bottom:20px}

/* [02] bid: score, one scale, plain factor list */
/* instrument gauge: hairline arc, tick scale, thin zone rails, slim needle */
.dial{display:block;width:100%;overflow:visible}
.bid-head{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:end;margin-top:14px}
.bid-side{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding-bottom:4px}
.dial .base{fill:none;stroke:var(--ink);stroke-width:1}
.dial .tk{stroke:var(--ink);stroke-width:1;animation:fade .4s ease both;animation-delay:calc(.2s + var(--i)*18ms)}
.dial .tk.mj{stroke-width:1.5}
.dial .tl{font:500 9px var(--mono);fill:var(--ink-3);letter-spacing:.5px;animation:fade .4s ease both;animation-delay:calc(.3s + var(--i)*18ms)}
.dial .rail{fill:none;stroke-width:4;stroke-dasharray:1;stroke-dashoffset:1;animation:arc .8s var(--ease) .5s forwards}
.dial .rail.r1{stroke:color-mix(in srgb,var(--bad) 55%,transparent)}
.dial .rail.r2{stroke:color-mix(in srgb,var(--warn) 60%,transparent)}
.dial .rail.r3{stroke:var(--ok)}
.dial .zl{font:500 8.5px var(--mono);letter-spacing:1px}
.dial .ghost{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.dial .ndl{transform-box:view-box;transform-origin:130px 128px;transform:rotate(39.6deg);animation:ndl 1.4s var(--spring) .7s both}
.dial .ndl line{stroke:var(--ink);stroke-width:2}
.dial .ndl circle{fill:var(--signal)}
.dial .hub{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
@keyframes ndl{from{transform:rotate(28.8deg)}}
@keyframes arc{to{stroke-dashoffset:0}}
.bid-n{display:flex;align-items:baseline;gap:8px}
.bid-n b{font-size:clamp(2.4rem,4vw,3rem);font-weight:250;letter-spacing:-.06em;line-height:1}
.bid-n span{font:.7rem/1 var(--mono);color:var(--ink-3);letter-spacing:.06em}
.verdict2{display:inline-flex;align-items:center;gap:8px;padding:7px 11px 7px 8px;background:var(--ok-bg);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);font:500 .66rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;animation:reveal .6s var(--ease) 1.4s both}
.verdict2 i{width:8px;height:8px;background:var(--ok)}
.factors{list-style:none;padding:0;margin:auto 0 0;padding-top:18px;display:grid;font-size:13px}
.factors li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);animation:rise .5s var(--ease) both;animation-delay:calc(1.1s + var(--i)*80ms)}
.sign{flex:none;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font:500 12px/1 var(--mono)}
.sign.p{background:var(--ok-bg);color:var(--ok)}.sign.m{background:var(--bad-bg);color:var(--bad)}

/* [03] summary */
.sum-p{flex:3 1 520px;margin:0;font-size:16px;line-height:1.75;min-width:0;font-weight:300}
.drv{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:7px 8px;transition:background .15s}
.drv:hover{background:var(--paper-2)}
.drv:focus-visible{outline:2px solid var(--signal)}
.drv-t{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.drv-t span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drv-bar{display:block;height:4px;background:var(--paper-3);margin-top:6px}
.drv-bar i{display:block;height:4px;background:var(--signal);transform-origin:left;animation:grow .9s var(--ease) both;animation-delay:calc(.3s + var(--i)*80ms)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.stat{font-size:12px;padding:6px 10px;border:1px solid var(--line)}
.stat b{font-weight:600}
.stat.blue{background:var(--signal-bg);border-color:transparent}
.stat.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.stat.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}

/* ---------- LV table ---------- */
.lv-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:44px 0 16px}
.lv-sum{text-align:right;font-size:12.5px;color:var(--ink-2)}
.lv-sum b{display:block;font-size:20px;font-weight:300;letter-spacing:-.03em;color:var(--ink)}
.lv-bar{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-bottom:0;background:var(--paper-2)}
.lv-bar .filters,.lv-bar .tools{margin:0;gap:6px}
.lv-bar .pill,.lv-bar .btn,.lv-bar .search,.lv-bar .ftag{height:32px}
.lv-bar .search{width:220px;background:var(--card)}
.lv-bar .seg{height:32px;padding:2px}
.lv-bar .seg button{height:26px}
.lv-bar .btn{padding:0 .75rem;font-size:.64rem}
.lv-bar .vsep{width:1px;height:20px;background:var(--line-2);margin:0 4px}
.lv-title{font-size:26px;font-weight:300;letter-spacing:-.035em;margin-top:6px}
.lv-title small{font-size:13px;color:var(--ink-2);letter-spacing:0}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-2);padding:2px;gap:2px}
.seg button{border:0;background:transparent;height:30px;padding:0 10px;font:.64rem/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);transition:background .15s,color .15s}
.seg button.on{background:var(--ink);color:var(--paper)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.pill{height:32px;padding:0 12px;border:1px solid var(--line-2);background:transparent;display:inline-flex;align-items:center;gap:8px;font:.66rem/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);transition:all .16s var(--ease)}
.pill:hover{color:var(--ink);border-color:var(--ink)}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.pill .cnt{opacity:.6}
.pill.on .cnt{opacity:1;color:var(--signal)}
.ftag{height:32px;padding:0 4px 0 12px;display:inline-flex;align-items:center;gap:4px;background:var(--signal-bg);color:var(--signal);font-size:12.5px;animation:tagin .45s var(--spring)}
@keyframes tagin{from{opacity:0;transform:scale(.85)}}
.ftag button{width:24px;height:24px;border:0;background:transparent;color:inherit;font-size:15px}
.ftag button:hover{background:color-mix(in srgb,var(--signal) 16%,transparent)}

.tbl{overflow-x:auto;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 88%,transparent)}
.lv-grid{display:grid;grid-template-columns:34px 56px 92px minmax(300px,1fr) 104px 150px 132px 46px;gap:12px;align-items:center;padding:0 16px}
.th{height:42px;color:var(--ink-3);border-bottom:1px solid var(--line-2);background:var(--paper-2)}
.sort{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:3px 5px;margin:0 -5px;transition:color .15s,background .15s}
.sort:hover{color:var(--ink);background:var(--paper-3)}
.sort.on{color:var(--ink)}
.sort.on b{color:var(--signal);font-weight:400}
.sort:focus-visible{outline:2px solid var(--signal)}
.cb{width:15px;height:15px;accent-color:var(--ink);cursor:pointer;margin:0}
.lv-r{position:relative;min-height:62px;padding-top:12px;padding-bottom:12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .14s;align-items:start}
.lv-r:hover{background:var(--paper-2)}
.lv-r.picked{background:var(--signal-bg)}
.lv-r.sel{box-shadow:inset 3px 0 0 var(--signal);background:var(--paper-2)}
.lv-r.is-ok .kurz{color:var(--ink-2)}
.lv-r.fx-ok::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent,var(--ok-bg) 30%,color-mix(in srgb,var(--ok) 22%,transparent) 50%,var(--ok-bg) 70%,transparent);
 background-size:250% 100%;animation:wash 1.1s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes wash{from{background-position:120% 0;opacity:1}to{background-position:-130% 0;opacity:0}}
.c2{padding-top:2px}
.risk{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:24px;padding:0 6px;font:500 12px/1 var(--mono)}
.risk.hi{background:var(--bad-bg);color:var(--bad);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad) 30%,transparent)}
.risk.mid{background:var(--warn-bg);color:var(--warn)}
.risk.lo{background:var(--ok-bg);color:var(--ok)}
.seal{position:absolute;right:-6px;top:-6px;width:13px;height:13px;background:var(--ok);color:var(--on-ok);display:flex;align-items:center;justify-content:center}
.seal svg{width:8px;height:8px;fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.fx-ok .seal{animation:seal .56s var(--spring) both}
.fx-ok .seal path{stroke-dasharray:20;stroke-dashoffset:20;animation:draw .3s var(--ease) .25s forwards}
.fx-ok .seal::after{content:"";position:absolute;inset:0;border:1.5px solid var(--ok);animation:ring .7s var(--ease) .12s both}
@keyframes seal{0%{transform:scale(0) rotate(-45deg)}100%{transform:none}}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(2.6);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
.kurz{all:unset;cursor:pointer;font-weight:500;font-size:14px;line-height:1.4;transition:color .2s}
.kurz:hover{text-decoration:underline;text-decoration-color:var(--signal);text-underline-offset:3px}
.kurz:focus-visible{outline:2px solid var(--signal)}
.lang{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.rmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:5px;font-size:11.5px}
.gw{all:unset;cursor:pointer;padding:1px 6px;margin-left:-6px;background:var(--paper-2);color:var(--ink-2);font:.62rem/1.6 var(--mono);letter-spacing:.06em;text-transform:uppercase;transition:all .15s}
.gw:hover{background:var(--ink);color:var(--paper)}
.why{display:inline-flex;align-items:center;gap:5px}
.why svg.i{width:12px;height:12px}
.why.hi{color:var(--bad)}.why.mid{color:var(--warn)}.why.lo{color:var(--ink-3)}
.chip{display:inline-block;font:.6rem/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;white-space:nowrap}
.chip.unsicher{background:var(--warn-bg);color:var(--warn)}
.chip.adaptiert{background:var(--signal-bg);color:var(--signal)}
.chip.übernommen{background:var(--paper-3);color:var(--ink-2)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bundle{background:var(--ok-bg);color:var(--ok);animation:tagin .5s var(--spring)}
.num{text-align:right}
.gpbar{display:block;height:3px;background:var(--paper-3);margin:8px 0 0 auto;width:76px}
.gpbar i{display:block;height:3px;margin-left:auto;transition:width .5s var(--ease)}
.av-btn{cursor:pointer;transition:transform .2s var(--spring)}
.av-btn:hover{transform:scale(1.12)}
.av.none{border:1px dashed var(--line-2);color:var(--ink-3);background:transparent;font-size:13px}
/* confirm button: green fills in from the left, tick draws, a ring goes out, confetti */
.okbtn{position:relative;width:32px;height:32px;border:1px solid var(--line-2);background:transparent;color:var(--ink-3);display:inline-flex;align-items:center;justify-content:center;padding:0;overflow:visible;
 transition:border-color .16s,color .16s,background .2s,transform .16s var(--ease)}
.okbtn::before{content:"";position:absolute;inset:0;background:var(--ok);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.okbtn svg{position:relative;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.okbtn:hover{border-color:var(--ok);color:var(--ok)}
.okbtn:active{transform:scale(.9)}
.okbtn.is-ok{border-color:var(--ok);color:var(--on-ok)}
.okbtn.is-ok::before{transform:none}
.okbtn.fx{animation:press .45s var(--spring)}
.okbtn.fx svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .32s var(--ease) .25s forwards}
.okbtn.fx::after{content:"";position:absolute;inset:-1px;border:1.5px solid var(--ok);animation:okring .75s var(--ease) both}
@keyframes okring{to{inset:-14px;opacity:0}}
@keyframes press{0%{transform:scale(.86)}100%{transform:none}}
.conf{position:absolute;left:50%;top:50%;width:6px;height:6px;background:var(--c);pointer-events:none;animation:confetti .8s var(--ease) forwards}
@keyframes confetti{from{transform:translate(-50%,-50%)}to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.3);opacity:0}}
.grp{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--paper-2);border-bottom:1px solid var(--line-2);font-size:13px;transition:background .15s}
.grp:hover{background:var(--paper-3)}
.grp:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
.foot{display:flex;justify-content:space-between;gap:16px;padding:15px 18px;background:var(--paper-2);font-size:13px;flex-wrap:wrap}
.empty{padding:48px 16px;text-align:center;color:var(--ink-2);border-bottom:1px solid var(--line)}

/* bulk dock */
.dock{position:fixed;left:50%;bottom:22px;z-index:30;transform:translateX(-50%);display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 8px 8px 18px;
 background:var(--ink);color:var(--paper);box-shadow:var(--shadow);animation:dockin .45s var(--spring);max-width:calc(100% - 32px)}
@keyframes dockin{from{opacity:0;transform:translate(-50%,30px)}}
.dock .n{font-size:20px;font-weight:300;letter-spacing:-.03em}
.dock .btn{border-color:color-mix(in srgb,var(--paper) 30%,transparent);color:var(--paper);height:34px}
.dock .btn:hover:not(:disabled){background:var(--paper);color:var(--ink)}
.dock .btn.go{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.dock .btn.go:hover{filter:brightness(1.1);background:var(--ok);color:var(--on-ok)}
.dock .mw .btn{gap:.4rem}
.dock-x{height:34px;border:1px solid color-mix(in srgb,var(--paper) 30%,transparent);background:var(--ink);color:var(--paper);padding:0 8px;font:.66rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}

/* ---------- drawer ---------- */
.dw{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);z-index:40;background:var(--paper);border-left:1px solid var(--line-2);box-shadow:var(--shadow);display:flex;flex-direction:column;outline:none;animation:slidein .42s var(--ease)}
@keyframes slidein{from{transform:translateX(40px);opacity:0}}
.dw-top{padding:14px 18px 10px 22px}
.dw-bar{display:flex;align-items:center;gap:6px;color:var(--ink-3)}
.ic{width:30px;height:30px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);padding:0;transition:background .15s}
.ic:hover:not(:disabled){background:var(--paper-2)}
.ic:disabled{opacity:.25;cursor:default}
.dw-swap{animation:swap .45s var(--ease)}
.dw-swap.next{animation:swapnext .55s var(--ease)}
.dw-swap.prev{animation:swapprev .55s var(--ease)}
.dw-swap.leaving{animation:leave .26s var(--ease) forwards}
@keyframes swap{from{opacity:0;transform:translateY(10px)}}
@keyframes swapnext{from{opacity:0;transform:translateX(56px)}}
@keyframes swapprev{from{opacity:0;transform:translateX(-56px)}}
@keyframes leave{to{opacity:0;transform:translateX(-48px)}}
.ozflash{animation:ozflash 1.2s var(--ease)}
@keyframes ozflash{0%,35%{background:var(--signal);color:#fff;box-shadow:0 0 0 4px var(--signal)}100%{background:transparent;box-shadow:0 0 0 4px transparent}}
.dw-cta{position:relative;z-index:2;padding:12px 18px;border-top:1px solid var(--line-2);background:var(--paper);box-shadow:0 -14px 24px -18px rgba(0,0,0,.35)}
.dw-cta .confirm,.dw-cta .okline{width:100%;margin:0}
.dw-cta .hint{margin:0 0 10px}
.dw-title{margin:8px 0 10px;font-size:24px;line-height:1.15;font-weight:300;letter-spacing:-.035em}
.dw-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.own{position:relative;display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 8px 0 2px;border:1px solid var(--line-2);background:transparent;font-size:12.5px;cursor:pointer;transition:background .15s,border-color .15s}
.own[aria-expanded="true"]{border-color:var(--ink)}
.own svg.i{width:13px;height:13px;color:var(--ink-3);transition:transform .25s var(--ease)}
.own[aria-expanded="true"] svg.i{transform:rotate(180deg)}
/* custom menus (no native dropdowns) */
.mw{position:relative;display:inline-flex}
.menu{position:absolute;top:calc(100% + 6px);right:0;z-index:60;min-width:250px;background:var(--paper);color:var(--ink);border:1px solid var(--ink);box-shadow:var(--shadow);padding:4px;transform-origin:top right;animation:menuin .22s var(--ease)}
.menu.up{top:auto;bottom:calc(100% + 10px);left:0;right:auto;transform-origin:bottom left}
@keyframes menuin{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.menu-h{padding:8px 10px 6px;color:var(--ink-3)}
.mi{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer;font:400 13px/1.25 var(--sans);color:var(--ink);transition:background .12s}
.mi:hover,.mi:focus-visible{background:var(--paper-2)}
.mi.on{background:var(--paper-3)}
.mi .mt{flex:1;min-width:0}
.mi small{display:block;font-size:11.5px;color:var(--ink-3)}
.mi .chk{color:var(--signal);display:flex}
.mi+.mi.none{border-top:1px solid var(--line);margin-top:4px;padding-top:10px}
.own:hover{background:var(--paper-2)}
.rl{display:flex;align-items:center;gap:7px;margin-top:12px;font-size:12.5px}
.rl.hi{color:var(--bad)}.rl.mid{color:var(--warn)}
.dw-body{flex:1;overflow-y:auto}
.price{position:relative;margin:8px 22px 0;padding:18px 18px 20px;border:1px solid var(--line);background:var(--card)}
.price .lab{color:var(--ink-3)}
.prow{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.ep{font-size:42px;font-weight:250;letter-spacing:-.05em;line-height:1}
.ep.flash{animation:flash .6s var(--ease)}
@keyframes flash{0%{color:var(--signal);transform:translateY(-6px);opacity:.3}100%{transform:none;opacity:1}}
.sub{font-size:13px;color:var(--ink-2);margin-top:6px}
.sub b{color:var(--ink);font-weight:500}
.price{transition:border-color .4s}
.price.is-ok{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.stamp{position:absolute;right:14px;top:14px;display:flex;align-items:center;gap:9px;padding:6px 12px 6px 6px;background:var(--ok-bg);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.stamp .sq{width:24px;height:24px;flex:none;background:var(--ok);color:var(--on-ok);display:grid;place-items:center}
.stamp .sq svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.stamp b{display:block;font:500 .66rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ok)}
.stamp small{display:block;font:400 11.5px/1 var(--sans);color:var(--ink-2);margin-top:4px}
.stamp.fx{animation:reveal .55s var(--ease) .1s both}
.stamp.fx .sq{animation:seal .5s var(--spring) both}
.stamp.fx .sq path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .35s var(--ease) .35s forwards}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.shead{color:var(--ink-3);margin:24px 22px 0}
.opts{margin:8px 22px 0;border-top:1px solid var(--line)}
.opt{border-bottom:1px solid var(--line)}
.opt-b{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 6px 12px 4px;transition:background .15s}
.opt:not(.on) .opt-b:hover{background:var(--paper-2)}
.opt-b:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
.rd{width:16px;height:16px;border:1.5px solid var(--line-2);margin-top:2px;position:relative;transition:border-color .2s}
.rd::after{content:"";position:absolute;inset:3px;background:var(--signal);transform:scale(0);transition:transform .3s var(--spring)}
.opt.on .rd{border-color:var(--signal)}
.opt.on .rd::after{transform:none}
.opt-t{display:block;font-size:14px;font-weight:500}
.opt-w{display:block;font-size:12.5px;line-height:1.45;color:var(--ink-2);margin-top:2px}
.opt-r{text-align:right;white-space:nowrap}
.opt-p{display:block;font-size:15px;font-weight:500}
.opt-d{display:block;font:.6rem/1.6 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.calc{margin:-2px 6px 12px 32px;padding:8px 12px;background:var(--paper-2);font-size:12.5px;animation:rise .35s var(--ease)}
.cs{display:flex;justify-content:space-between;gap:12px;padding:3px 0;color:var(--ink-2)}
.cs span:last-child{font-family:var(--mono);font-size:12px}
.cs.last{color:var(--ink);font-weight:500;border-top:1px solid var(--line-2);margin-top:4px;padding-top:7px}
.epin{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.epin input{border:0;border-bottom:1.5px solid var(--signal);outline:0;background:transparent;font-weight:500;width:96px;text-align:right;padding:2px 0;font-size:15px}
.hint{margin:10px 22px 0;font-size:12.5px;color:var(--warn);background:var(--warn-bg);padding:8px 10px;display:flex;gap:8px;align-items:flex-start}
/* the decisive button: approval badge, two-line label, GP on the right; far-off prices must be held */
.confirm{position:relative;overflow:hidden;width:calc(100% - 44px);margin:18px 22px 0;display:flex;align-items:center;gap:14px;height:62px;padding:0 18px 0 12px;border:0;background:var(--ink);color:var(--paper);text-align:left;
 transition:transform .16s var(--ease),box-shadow .25s;user-select:none;-webkit-user-select:none;touch-action:none}
.confirm>span,.confirm>svg{position:relative;z-index:1}
.cbadge{flex:none;width:38px;height:38px;display:grid;place-items:center;background:var(--ok);color:var(--on-ok);transition:background .3s}
.cbadge svg{transition:transform .35s var(--spring)}
.confirm .cfill{position:absolute;inset:0;z-index:0;background:var(--ok);transform:scaleX(0);transform-origin:left;transition:transform .55s var(--ease)}
.confirm.is-confirming{color:var(--on-ok);transition:color .25s .2s;pointer-events:none}
.confirm.is-confirming .cfill{transform:none}
.confirm.is-confirming::after,.confirm.is-confirming .cgo{display:none}
.confirm.is-confirming .cbadge{background:color-mix(in srgb,var(--on-ok) 18%,transparent);color:var(--on-ok)}
.confirm.is-confirming .cbadge path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .35s var(--ease) .25s forwards}
.cbadge svg.i{width:18px;height:18px;stroke-width:2.6}
.confirm .cl{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.confirm .cl b{font:500 .76rem/1 var(--mono);letter-spacing:.09em;text-transform:uppercase}
.confirm .cl small{font:400 12.5px/1.2 var(--sans);opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.confirm .ca{display:flex;flex-direction:column;align-items:flex-end;gap:5px;white-space:nowrap}
.confirm .ca small{font:400 .6rem/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;opacity:.55}
.confirm .ca b{font:500 17px/1 var(--sans);letter-spacing:-.02em}
.confirm .cgo{flex:none;width:38px;height:38px;margin-left:6px;display:grid;place-items:center;border:1px solid color-mix(in srgb,currentColor 28%,transparent);transition:background .25s,border-color .25s,color .25s}
.confirm .arrow{width:16px;height:16px;stroke-width:2;transition:transform .3s var(--spring)}
.confirm::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%);transform:translateX(-120%);animation:pay-sheen 3.6s ease-in-out infinite;pointer-events:none}
.confirm::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--ok);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.confirm:hover{transform:translateY(-1px);box-shadow:0 18px 36px -16px color-mix(in srgb,var(--ok) 60%,rgba(0,0,0,.5))}
.confirm:hover::before{transform:none}
.confirm:hover .cbadge svg{transform:scale(1.18)}
.confirm:hover .cgo{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.confirm:hover .arrow{transform:translateX(2px)}
.confirm:active{transform:scale(.985)}
.confirm.hold .cbadge{background:var(--warn);color:#fff}
.confirm.hold::before{top:0;height:auto;background:var(--warn);opacity:.9;transition:transform .25s var(--ease)}
.confirm.hold:hover::before{transform:scaleX(0)}
.confirm.hold.is-holding::before{transform:none;transition:transform 1.2s linear}
.confirm.hold.is-holding{animation:shake .12s linear infinite;animation-delay:.6s}
@keyframes shake{0%,100%{transform:translateX(0)}50%{transform:translateX(1px)}}
.okline{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;margin:18px 22px 0;min-height:62px;padding:12px 16px;background:var(--ok);color:var(--on-ok);font:500 .72rem/1 var(--mono);letter-spacing:.07em;text-transform:uppercase}
.okline.fx{animation:land .55s var(--spring)}
.okline.fx svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .34s var(--ease) .2s forwards}
.okline .adv{margin-left:auto;all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font:500 .68rem/1 var(--mono);letter-spacing:.07em;text-transform:uppercase}
.okline .adv svg.i{width:14px;height:14px;transition:transform .2s var(--ease)}
.okline .adv:hover svg.i{transform:translateX(3px)}
.okline .advbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--on-ok);opacity:.45;transform-origin:left;animation:advbar 2.4s linear forwards}
@keyframes advbar{from{transform:scaleX(0)}}
.okline .lnk{margin-left:auto;color:var(--on-ok);text-decoration-color:currentColor;text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:12.5px}
.okline svg.i{width:16px;height:16px;stroke-width:2.6}
@keyframes land{0%{transform:scale(.92);opacity:0}100%{transform:none;opacity:1}}
.steps{margin:4px 22px 0;border-top:1px solid var(--line)}
.step{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.sic{width:18px;height:18px;border:1.5px solid var(--line-2);display:flex;align-items:center;justify-content:center;color:var(--on-ok)}
.sic svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.sic.done{background:var(--ok);border-color:var(--ok);animation:seal .5s var(--spring)}
.sic.done path{stroke-dasharray:20;stroke-dashoffset:20;animation:draw .3s var(--ease) .2s forwards}
.step.done .opt-t{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ok)}
.oks{font:.62rem/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ok)}
.dpills{display:flex;gap:2px;padding:14px 18px;margin-top:20px;border-top:1px solid var(--line)}
.dpill{height:32px;padding:0 12px;border:0;background:transparent;color:var(--ink-3);display:inline-flex;align-items:center;gap:7px;font:.66rem/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;transition:all .15s}
.dpill:hover{color:var(--ink);background:var(--paper-2)}
.dpill.on{color:var(--ink);background:var(--paper-3)}
.dn{font-size:.6rem;min-width:17px;height:17px;padding:0 5px;background:var(--ink);color:var(--paper);display:inline-flex;align-items:center;justify-content:center}
.panel{padding:0 22px 28px;font-size:13px;animation:rise .35s var(--ease)}
.pempty{color:var(--ink-2);line-height:1.55;margin:0}
.bub{padding:9px 12px;line-height:1.5;border:1px solid var(--line);background:var(--card)}
.bub.me{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bub.out{background:var(--signal-bg);border-color:transparent}
.note{margin-top:10px;padding:8px 10px;background:var(--warn-bg);font-size:12.5px;border-left:2px solid var(--warn)}
.fld{flex:1;min-width:0;height:36px;border:1px solid var(--line-2);background:transparent;padding:0 10px;font-size:13px;outline:0;transition:border-color .15s,box-shadow .15s}
.fld:focus{border-color:var(--ink);box-shadow:3px 3px 0 var(--signal)}
textarea.fld{height:auto;padding:8px 10px;resize:vertical;display:block;width:100%}
.seqbox{margin-top:12px;border:1px solid var(--signal);background:var(--signal-bg);padding:14px;animation:rise .35s var(--ease)}
.seqrow{display:flex;gap:12px;margin-top:10px;font-size:12.5px}
.seqrow .mono{flex:none;width:46px;color:var(--signal);padding-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.qchip{border:1px solid var(--line-2);background:transparent;padding:6px 10px;font-size:12px;transition:all .15s}
.qchip:hover{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.agent-ic{flex:none;width:26px;height:26px;background:var(--signal-bg);color:var(--signal);display:flex;align-items:center;justify-content:center}
.thinking{position:relative;overflow:hidden}
.thinking::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,var(--signal) 18%,transparent) 50%,transparent 70%);background-size:300% 100%;animation:sheen 1.1s linear infinite}
.dot{width:5px;height:5px;background:var(--signal);display:inline-block;animation:dots 1.2s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes dots{0%,80%,100%{opacity:.2;transform:none}40%{opacity:1;transform:translateY(-3px)}}
.ask{border-top:1px solid var(--line-2);padding:12px 18px 16px;background:var(--paper)}
.askin{display:flex;gap:8px;align-items:center;border:1px solid var(--line-2);padding:5px 5px 5px 12px;transition:border-color .15s,box-shadow .15s}
.askin:focus-within{border-color:var(--ink);box-shadow:3px 3px 0 var(--signal)}
.askin input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:13.5px}
.send{flex:none;width:34px;height:34px;border:0;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;transition:background .15s}
.send:hover{background:var(--signal)}
.send:hover svg{animation:nudge .5s var(--ease)}
@keyframes nudge{50%{transform:translateX(3px)}}

/* ---------- modal + fx overlay ---------- */
.scrim{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:color-mix(in srgb,var(--paper) 55%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.modal h3,.modal p,.dw-title,.kurz,.lang,.sum-p,.rl span,.why2 p{overflow-wrap:anywhere}
.modal h3.long{font-size:17px!important;line-height:1.35}
.modal{width:min(540px,100%);max-height:calc(100vh - 48px);overflow-y:auto;background:var(--paper);border:1px solid var(--ink);padding:24px 26px;box-shadow:var(--shadow);animation:pop .4s var(--spring)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:16px}
.kv>div{background:var(--card);padding:10px 12px}
.kv .mono{color:var(--ink-3)}
.fxcard{width:min(440px,100%);background:var(--paper);border:1px solid var(--ink);padding:2.2rem 2rem 1.8rem;display:grid;justify-items:center;text-align:center;gap:.35rem;box-shadow:var(--shadow);animation:pop .45s var(--spring)}
.fxv{position:relative;width:112px;height:112px;margin-bottom:.6rem}
.fxv svg{position:absolute;inset:0;display:block;width:112px;height:112px;overflow:visible}
.fx-track{fill:none;stroke:var(--line);stroke-width:3}
.fx-ring{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:245;transform-origin:60px 60px;animation:spin 1s linear infinite;transition:stroke-dashoffset .5s ease,stroke .3s}
.fx-check{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80}
.fx-warn{fill:none;stroke:var(--warn);stroke-width:5;stroke-linecap:round}
.fxv.done .fx-ring{animation:none;stroke-dashoffset:0;stroke:var(--ok)}
.fxv.done .fx-check{animation:draw .45s var(--ease) .25s forwards}
.fxv.done{animation:fxpop .5s var(--spring) .2s}
.fxv.is-warn .fx-ring{animation:none;stroke-dashoffset:0;stroke:var(--warn)}
@keyframes fxpop{50%{transform:scale(1.08)}}
.burst{position:absolute;inset:0;border-radius:50%;border:2px solid var(--ok);opacity:0}
.fxv.done .burst{animation:burst .9s var(--ease) .3s}
.fxv.done .burst.b2{animation-delay:.5s}
@keyframes burst{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.9);opacity:0}}
.spark{position:absolute;left:50%;top:50%;width:6px;height:6px;opacity:0;background:var(--c)}
.fxv.done .spark{animation:spark .8s var(--ease) .35s forwards}
@keyframes spark{0%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
.fx-amt{font-size:clamp(2.2rem,7vw,2.9rem);font-weight:250;letter-spacing:-.05em;line-height:1}
.fx-title{color:var(--ink-2);margin:.4rem 0 .6rem}
.fx-steps{list-style:none;padding:.9rem 0 0;margin:.4rem 0 0;display:grid;gap:.5rem;text-align:left;width:100%;border-top:1px solid var(--line)}
.fx-steps li{display:flex;gap:.7rem;align-items:center;font-size:.88rem;color:var(--ink-3);transition:color .2s}
.fx-steps .si{width:14px;height:14px;flex:none;border:1.5px solid var(--line-2);display:flex;align-items:center;justify-content:center}
.fx-steps li.run{color:var(--ink)}
.fx-steps li.run .si{border-color:var(--ink);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.fx-steps li.done{color:var(--ink)}
.fx-steps li.done .si{background:var(--ok);border-color:var(--ok);color:var(--on-ok);animation:seal .4s var(--spring)}
.fx-steps .si svg{width:8px;height:8px;fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.fx-btns{display:flex;gap:8px;justify-content:center;margin-top:1.2rem;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:24px;z-index:80;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);padding:11px 16px;font:.7rem/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;box-shadow:var(--shadow);animation:toastin .45s var(--spring);max-width:calc(100% - 32px)}
.toast i{width:8px;height:8px;background:var(--ok);flex:none}
.has-dock .toast{bottom:92px}
@keyframes toastin{from{opacity:0;transform:translate(-50%,16px)}}

/* Kontext */
.ctx{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:24px}
.ctx h2{margin:6px 0 4px;font-size:20px;font-weight:300;letter-spacing:-.03em}
.ctx-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.ctx-row span:first-child{display:flex;align-items:center;gap:9px;min-width:0}
.ctx-row i{width:8px;height:8px;flex:none}

@media (max-width:720px){
 .top-in,main{padding-left:16px;padding-right:16px}
 .prog{grid-template-columns:1fr}
 .search{width:100%}
}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0ms!important;transition-duration:.01ms!important}
}

/* price: single editable proposal */
.ep{all:unset;cursor:text;position:relative;display:inline-flex;align-items:baseline;gap:8px;font-size:42px;font-weight:250;letter-spacing:-.05em;line-height:1;border-bottom:1.5px dashed transparent;padding-bottom:3px;transition:border-color .2s}
.ep:hover,.ep:focus-visible{border-bottom-color:var(--line-2)}
.ep .pen{display:inline-flex;opacity:0;transform:translateX(-4px);transition:opacity .2s,transform .2s var(--ease);color:var(--ink-3)}
.ep .pen svg{width:16px;height:16px}
.ep:hover .pen,.ep:focus-visible .pen{opacity:1;transform:none}
.epedit{display:inline-flex;align-items:baseline;gap:6px;border-bottom:1.5px solid var(--signal);padding-bottom:3px}
.epedit input{all:unset;font-size:42px;font-weight:250;letter-spacing:-.05em;line-height:1;field-sizing:content;min-width:3ch;max-width:9ch;caret-color:var(--signal)}
.epedit .cur{font-size:42px;font-weight:250;letter-spacing:-.05em;line-height:1;color:var(--ink-3)}
.price.is-edit{border-color:var(--ink);box-shadow:4px 4px 0 var(--signal)}
.edhint{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.keys{font:.6rem/1.8 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.keys kbd{font:inherit;border:1px solid var(--line-2);padding:1px 5px;margin:0 3px 0 6px;color:var(--ink-2)}
.why2{margin:18px -18px -20px;padding:16px 18px 18px;border-top:1px solid var(--line)}
.why2 p{margin:8px 0 0;font-size:13.5px;line-height:1.6;color:var(--ink-2);max-width:60ch}
.calc2{margin-top:12px;padding:10px 12px;background:var(--paper-2);font-size:12.5px}
.refs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}
.refs>.mono{color:var(--ink-3);margin-right:4px;line-height:28px}
.ref{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;line-height:1;border:1px solid var(--line-2);background:transparent;font-size:12px;cursor:pointer;transition:border-color .15s,background .15s}
.ref small{font:.58rem/1 var(--mono);padding-top:1px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.ref:hover{border-color:var(--ink);background:var(--card)}
/* kommunikation */
.comm{margin:22px 22px 0}
.comm-h{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.comm-h>.mono{color:var(--ink-3)}
.ctabs{display:flex}
.ctab{position:relative;height:38px;padding:0 12px;border:0;background:transparent;color:var(--ink-3);display:inline-flex;align-items:center;gap:7px;font:.66rem/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;cursor:pointer;transition:color .15s}
.ctab::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--ink);transform:scaleX(0);transition:transform .3s var(--ease)}
.ctab:hover{color:var(--ink)}
.ctab.on{color:var(--ink)}
.ctab.on::after{transform:scaleX(1)}
.ctab .dn{background:var(--paper-3);color:var(--ink-2)}
.ctab.on .dn{background:var(--ink);color:var(--paper)}
.comm .panel{padding:16px 0 28px}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:0}
.feed li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.feed li:not(:last-child)::before{content:"";position:absolute;left:12.5px;top:30px;bottom:4px;width:1px;background:var(--line)}
.feed .av{width:26px;height:26px;font-size:10px}
.fh{display:flex;align-items:baseline;gap:8px;font-size:12.5px}
.fh b{font-weight:500}
.fh span{font:.6rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.fb p{margin:4px 0 0;line-height:1.55;color:var(--ink-2)}
.composer{display:flex;align-items:center;border:1px solid var(--line-2);margin-top:6px;transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:var(--ink);box-shadow:3px 3px 0 var(--signal)}
.composer label{flex:1;display:flex}
.composer input{all:unset;flex:1;height:38px;padding:0 12px;font-size:13px}
.composer button{width:38px;height:38px;border:0;border-left:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s}
.composer button:hover{background:var(--ink);color:var(--paper)}
.xc{display:flex;align-items:center;gap:12px;padding:12px;background:var(--paper-2)}
.xc b{display:block;font-weight:500;font-size:13.5px}
.xc small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.xi{flex:none;width:32px;height:32px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.xs{font:.6rem/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--warn);white-space:nowrap}
.msgs{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:14px}
.msgs li{padding-left:14px;border-left:2px solid var(--line-2)}
.msgs li.out{border-left-color:var(--signal)}
.msgs .mk{font:.6rem/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.msgs li.out .mk{color:var(--signal)}
.msgs p{margin:5px 0 0;line-height:1.55}
.msgs small{display:block;margin-top:4px;font-size:11.5px;color:var(--ink-3)}
.xact{display:flex;gap:8px;margin-top:16px}

/* ---- [04] polish ---- */
.lv-head{margin:48px 0 18px;align-items:flex-end}
.lv-stats{display:flex;gap:28px}
.lv-stat{min-width:150px;text-align:right}
.lv-stat .mono{color:var(--ink-3)}
.lv-stat b{display:block;font-size:22px;font-weight:300;letter-spacing:-.035em;margin-top:6px;line-height:1}
.lv-stat b small{font-size:14px;color:var(--ink-3);letter-spacing:0}
.lv-meter{display:block;height:2px;background:var(--line);margin-top:9px;position:relative;overflow:hidden}
.lv-meter>i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);transition:width .8s var(--ease)}
.lv-bar{padding:0 12px 0 6px;background:var(--card);border:1px solid var(--line);border-bottom:1px solid var(--line);min-height:52px}
.lv-bar .filters{gap:0;align-self:stretch}
.lv-bar .pill{position:relative;height:auto;align-self:stretch;min-height:50px;padding:0 12px;border:0;background:transparent;color:var(--ink-3)}
.lv-bar .pill::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
.lv-bar .pill:hover{color:var(--ink);background:transparent}
.lv-bar .pill.on{background:transparent;color:var(--ink)}
.lv-bar .pill.on::after{transform:scaleX(1)}
.lv-bar .pill .cnt{min-width:18px;height:17px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;background:var(--paper-2);color:var(--ink-3);opacity:1;font-size:.6rem;transition:background .2s,color .2s}
.lv-bar .pill.on .cnt{background:var(--ink);color:var(--paper)}
.lv-bar .ftag{align-self:center;margin-left:8px}
.lv-bar .tools{padding:9px 0}
.lv-bar .search{background:var(--paper)}
.lv-bar .btn-quiet{border-color:transparent}
.lv-bar .btn-quiet:hover{border-color:var(--line-2);background:var(--paper-2)}
.lv-bar .btn-quiet.on,.lv-bar .btn-quiet.on:hover{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.tbl{border-top:0}
.th{height:40px;background:transparent;border-bottom:1px solid var(--line-2);font-size:.6rem}
.foot{align-items:center;padding:14px 16px;background:transparent;border-top:1px solid var(--ink)}
.foot>.mono{color:var(--ink-3)}
.ft-r{display:flex;align-items:baseline;gap:14px}
.ft-r .mono{color:var(--ink-3)}
.ft-r b{font-size:18px;font-weight:400;letter-spacing:-.02em}
/* checkbox */
.cb{appearance:none;-webkit-appearance:none;position:relative;width:16px;height:16px;margin:0;border:1px solid var(--line-2);background:var(--card);cursor:pointer;display:inline-grid;place-items:center;transition:border-color .15s,background .15s,box-shadow .15s}
.cb:hover{border-color:var(--ink)}
.cb:focus-visible{outline:none;box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--signal)}
.cb::before{content:"";width:4px;height:8px;border:solid var(--paper);border-width:0 1.6px 1.6px 0;transform:translateY(-1px) rotate(45deg) scale(0);transition:transform .22s var(--spring)}
.cb:checked{background:var(--ink);border-color:var(--ink)}
.cb:checked::before{transform:translateY(-1px) rotate(45deg) scale(1)}
.cb.some{border-color:var(--ink)}
.cb.some::before{width:8px;height:0;border-width:0 0 1.6px 0;border-color:var(--ink);transform:none}
.lv-r .cb{margin-top:2px}
.lv-r.picked:not(.sel){box-shadow:inset 2px 0 0 var(--ink)}
@media (max-width:760px){.lv-stats{gap:18px}.lv-stat{min-width:0;text-align:left}.lv-bar .tools{width:100%}}
.lv-r>[role=cell]:last-child{display:flex;justify-content:center}

/* ---- table v3 ---- */
.rsk{display:inline-flex;flex-direction:column;gap:5px;width:38px}
.rsk b{font:500 13px/1 var(--mono);letter-spacing:.02em}
.rsk.hi b{color:var(--bad)}.rsk.mid b{color:var(--warn)}.rsk.lo b{color:var(--ink-3)}
.rbar{display:block;height:2px;background:var(--line);position:relative}
.rbar>i{position:absolute;left:0;top:0;bottom:0}
.rsk.hi .rbar>i{background:var(--bad)}.rsk.mid .rbar>i{background:var(--warn)}.rsk.lo .rbar>i{background:var(--ink-3)}
.mtag{display:inline-flex;align-items:center;gap:6px;font:.6rem/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.mtag>i{width:6px;height:6px;flex:none;background:var(--ink-3)}
.mtag.unsicher>i{background:var(--warn)}.mtag.unsicher{color:var(--warn)}
.mtag.adaptiert>i{background:var(--signal)}
.mtag.ok>i{background:var(--ok)}.mtag.ok{color:var(--ok)}
.lv-r{min-height:64px;padding-top:14px;padding-bottom:14px}
.lv-r .c2{padding-top:1px}
.lv-r .kurz{font-size:14.5px}
.gw{background:transparent;padding:0;margin:0;color:var(--ink-3)}
.gw:hover{background:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.rmeta{gap:4px 14px;margin-top:6px}
.rmeta>.gw+.why::before{content:"";width:1px;height:10px;background:var(--line-2);margin-right:9px}
.gpbar{height:2px;width:64px;background:var(--line)}
.gpbar i{height:2px}
.okbtn{width:30px;height:30px}
.th>span:first-child{display:flex}
/* ---- drawer header v3 ---- */
.dw-top{padding:14px 18px 16px 22px;border-bottom:1px solid var(--line)}
.dw-bar{gap:10px}
.ozt{font:500 .72rem/1 var(--mono);letter-spacing:.06em;color:var(--paper);background:var(--ink);padding:6px 8px}
.gwt{font:.64rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ozt,.navg{flex:none;white-space:nowrap}
.navg{display:flex;align-items:center;border:1px solid var(--line-2)}
.navg .ic{width:28px;height:28px}
.navg .ic svg{width:14px;height:14px}
.navc{font:.64rem/1 var(--mono);letter-spacing:.06em;color:var(--ink-3);padding:0 6px;min-width:52px;text-align:center;white-space:nowrap}
.navc b{color:var(--ink);font-weight:500}
.xbtn{border:1px solid transparent}
.xbtn:hover{border-color:var(--line-2)}
.dw-title{margin:16px 0 14px;font-size:26px;line-height:1.12}
.dmeta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.dmeta>div{padding:10px 12px 11px 0}
.dmeta>div+div{padding-left:12px;border-left:1px solid var(--line)}
.dmeta dt{font:.58rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.dmeta dd{margin:8px 0 0;font-size:13.5px;min-height:15px;display:flex;align-items:center}

.cp-h{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}

@keyframes pulse{50%{opacity:.3}}

/* boxed lower sections + agent reveal */

.comm,.gwsec{margin:12px 22px 0;border:1px solid var(--line);background:var(--card);padding:0 16px}
.comm-h{border-bottom:1px solid var(--line);margin:0 -16px;padding:0 6px 0 16px}
.gwsec .comm-h{padding-right:16px}
.comm .panel{padding:14px 0 16px}
.gwsec .panel{padding:4px 0 12px}
.aichat{margin:12px 22px 24px;border:1px solid var(--ink);background:var(--card);box-shadow:5px 5px 0 var(--signal);display:flex;flex-direction:column;min-height:300px}
.aichat .cp-h .ic{width:28px;height:28px}
.dw.ai-open .askin{border-color:var(--ink)}

/* ---- chat priority: stack everything ---- */
.E{}
.price,.gwsec,.comm{position:relative;transition:max-height .55s var(--ease),margin .55s var(--ease),padding .55s var(--ease),box-shadow .4s,border-color .4s}
.price{max-height:900px}.gwsec{max-height:700px}.comm{max-height:1400px}
.mini{all:unset;box-sizing:border-box;position:absolute;inset:0 0 auto 0;height:40px;display:flex;align-items:center;gap:10px;padding:0 14px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;overflow:hidden}
.mini .mono{color:var(--ink-3);font-size:.58rem}
.mini b{font-weight:500;font-size:13px}
.mini .muted{font-size:12px;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.mini .conf-v b{font-size:14px}
.price>:not(.mini),.gwsec>:not(.mini),.comm>:not(.mini){transition:opacity .3s .15s}
.dw.ai-open .dw-body{overflow:hidden;display:flex;flex-direction:column}
.dw.ai-open .dw-body>.dw-swap{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 0 12px}
.dw.ai-open .lower,.dw.ai-open .lowin{display:contents}
.dw.ai-open .price,.dw.ai-open .gwsec,.dw.ai-open .comm{flex:none;max-height:40px;overflow:hidden;padding-top:0;padding-bottom:0;box-shadow:none;border-color:var(--line)}
.dw.ai-open .price{margin:12px 22px 0}
.dw.ai-open .gwsec{margin:6px 22px 0}
.dw.ai-open .comm:not(.gwsec){margin:6px 22px 0}
.dw.ai-open .cmts{display:none} /* comments have no collapsed bar; hide them while the chat is open */
.dw.ai-open .price>:not(.mini),.dw.ai-open .gwsec>:not(.mini),.dw.ai-open .comm>:not(.mini){opacity:0;transition:opacity .15s}
.dw.ai-open .mini{opacity:1;pointer-events:auto;transition:opacity .3s .2s}
.dw.ai-open .mini:hover{background:var(--paper-2)}
.dw.ai-open .aiwrap{flex:1;min-height:0}
.dw.ai-open .aiin{display:flex}
.dw.ai-open .aichat{flex:1;min-height:0;margin:10px 22px 0;animation:chatup .5s var(--ease)}
@keyframes chatup{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.aichat .cp-log{min-height:0}
.pchat .aichat{flex:1;min-height:0;margin:16px;animation:chatup .5s var(--ease)}
.pchat .ask{padding:10px 12px 12px}
/* header compresses */
.dw-title,.dmeta,.rl{transition:font-size .45s var(--ease),margin .45s var(--ease),max-height .45s var(--ease),opacity .3s,padding .45s var(--ease)}
.dmeta,.rl{max-height:120px}
.dw.ai-open .dw-title{font-size:16px;margin:10px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dw.ai-open .dmeta,.dw.ai-open .rl{max-height:0;opacity:0;margin-top:0;padding-top:0;padding-bottom:0;border-width:0;overflow:hidden}
.dw.ai-open .dw-top{padding-bottom:10px}
/* confirm bar compresses */
.confirm,.okline{transition:transform .16s var(--ease),box-shadow .25s,height .45s var(--ease),min-height .45s var(--ease),padding .45s var(--ease)}
.confirm .cl small,.confirm .ca small,.cbadge{transition:opacity .25s,max-height .4s var(--ease),width .4s var(--ease),height .4s var(--ease)}
.confirm .cl small,.confirm .ca small{max-height:20px}
.dw-cta{transition:padding .45s var(--ease)}
.dw.ai-open .dw-cta{padding:6px 18px}
.dw.ai-open .dw-cta .hint{display:none}
.dw.ai-open .confirm{height:38px}
.dw.ai-open .confirm .cl small,.dw.ai-open .confirm .ca small{opacity:0;max-height:0}
.dw.ai-open .confirm .cl,.dw.ai-open .confirm .ca{gap:0}
.dw.ai-open .confirm .cbadge,.dw.ai-open .confirm .cgo{width:26px;height:26px}
.dw.ai-open .confirm .ca b{font-size:14px}
.dw.ai-open .okline{min-height:38px;padding:6px 14px}
.price>.mini,.gwsec>.mini{height:40px}

/* ---- [04] split: Bauplan + table ---- */
.lv-split{display:grid;grid-template-columns:minmax(380px,43fr) minmax(0,57fr);gap:16px;align-items:start}
.lv-main{min-width:0}
.plan{position:sticky;top:76px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column}
.plan-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px 0 16px;min-height:52px;border-bottom:1px solid var(--line)}

.plan-h .seg{height:30px;padding:2px}.plan-h .seg button{height:24px}

.plan-svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-x pan-y}
.plan-svg.zoomed{overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.plan-svg.panning{cursor:grabbing}
.pz{display:flex;align-items:stretch;height:30px;border:1px solid var(--line-2)}
.pz button{all:unset;box-sizing:border-box;cursor:pointer;min-width:30px;display:grid;place-items:center;color:var(--ink-2);transition:background .15s,color .15s}
.pz button:hover{background:var(--paper-2);color:var(--ink)}
.pz button:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
.pz svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round}
.pz .pz-v{min-width:56px;padding:0 6px;font:.6rem/1 var(--mono);letter-spacing:.04em;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.plan-svg .axl{stroke:var(--line-2);stroke-width:.8;stroke-dasharray:6 6}
.plan-svg .axc{fill:var(--card);stroke:var(--ink-3);stroke-width:1}
.plan-svg .axt{font:500 11px var(--mono);fill:var(--ink-2);text-anchor:middle}
.plan-svg .pit{fill:none;stroke:var(--warn);stroke-width:1.2;stroke-dasharray:10 6;opacity:.7}
.plan-svg .pitl{font:9px var(--mono);letter-spacing:.12em;fill:var(--warn)}
.plan-svg .slab{fill:color-mix(in srgb,var(--paper-2) 70%,transparent)}
.plan-svg .wall{fill:none;stroke:var(--ink);stroke-width:7;stroke-linejoin:miter}
.plan-svg .wall.in{stroke-width:3}
.plan-svg .stair{stroke:var(--ink-3);stroke-width:1}
.plan-svg .door{fill:var(--paper-2)}
.plan-svg .win{fill:var(--card);stroke:var(--ink);stroke-width:1.2}
.plan-svg .rl2{font:9.5px var(--mono);letter-spacing:.1em;fill:var(--ink-3);text-anchor:middle}
.plan-svg .dim{fill:none;stroke:var(--ink-3);stroke-width:1}
.plan-svg .dimt{font:10px var(--mono);fill:var(--ink-2);text-anchor:middle}
.plan-svg .xh line{stroke:var(--signal);stroke-width:1;stroke-dasharray:3 4;opacity:0;transition:opacity .2s}
.plan-svg.xh-on .xh line{opacity:.9}
.mk{cursor:pointer;outline:none}
.mk-b{stroke:var(--card);stroke-width:2;transition:transform .25s var(--spring)}
.mk-t{font:600 12px var(--mono);fill:#fff;text-anchor:middle;pointer-events:none}
.mk.hi .mk-b{fill:var(--bad)}.mk.mid .mk-b{fill:var(--warn)}.mk.lo .mk-b{fill:var(--ink-2)}.mk.ok .mk-b{fill:var(--ok)}
.mk-ring{fill:none;stroke:var(--signal);stroke-width:2;opacity:0;transform:scale(.6);transition:opacity .2s,transform .3s var(--ease)}
.mk:hover .mk-b,.mk.hot .mk-b,.mk:focus-visible .mk-b{transform:scale(1.25)}
.mk.hot .mk-ring,.mk:focus-visible .mk-ring{opacity:1;transform:none}
.mk.sel .mk-ring{opacity:1;transform:none;stroke:var(--ink);animation:mkpulse 1.8s var(--ease) infinite}
@keyframes mkpulse{50%{transform:scale(1.25);opacity:.35}}
.mk.dim{opacity:.18}

function morph(a, b) {
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName || (a.nodeType === 1 && a.getAttribute('data-k') !== b.getAttribute('data-k'))) { a.parentNode.replaceChild(b, a); return; }

  var i, at;
  for (i = a.attributes.length - 1; i >= 0; i--) { at = a.attributes[i]; if (!b.hasAttribute(at.name)) a.removeAttribute(at.name); }
  for (i = 0; i < b.attributes.length; i++) { at = b.attributes[i]; if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value); }
  if (a.tagName === 'INPUT') {
    if (a.type === 'checkbox') a.checked = b.hasAttribute('checked');

    return;

  news.forEach(function (nb) {

document.addEventListener('change', function (e) {
  var fk = e.target.getAttribute && e.target.getAttribute('data-file');
  if (fk) { if (/^lib/.test(fk)) takeLib(fk, e.target.files); else takeFiles(e.target.files); e.target.value = ''; return; }
  var k = e.target.getAttribute && e.target.getAttribute('data-change');
  if (!k) return;
  var v = e.target.value;
  if (k === 'bulkAssign' && v && T[v]) {
    var pr = derive().all.filter(function (r) { return S.picked[r.oz]; }), o = Object.assign({}, S.owners);
    pr.forEach(function (r) { o[r.oz] = v; }); set({ owners: o }); toast(pr.length + ' items assigned to ' + T[v].name);
  }
  if (k === 'setOwner') { var o2 = Object.assign({}, S.owners); o2[S.sel] = v; set({ owners: o2 }); toast(v ? S.sel + ' assigned to ' + T[v].name : 'Assignment for ' + S.sel + ' removed'); }
});
document.addEventListener('keydown', function (e) {
  var tg = e.target.tagName, inField = tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT';
  if (e.key === 'Enter' && inField && e.target.getAttribute('data-enter')) { e.preventDefault(); var n = e.target.getAttribute('data-enter'); if (n === 'saveEp') saveEp(); else if (n === 'sendCmt') addComment(); else if (n === 'sendDraft') send(S.draft); else if (n === 'sendPdraft') send(S.pdraft, true); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.hasAttribute && e.target.hasAttribute('data-hold')) { e.preventDefault(); confirmCurrent(); return; }
  if (S.menu && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && e.target.classList && e.target.classList.contains('mi')) {
    e.preventDefault(); var sib = e.key === 'ArrowDown' ? e.target.nextElementSibling : e.target.previousElementSibling;
    if (sib && sib.classList.contains('mi')) sib.focus(); return;
  }
  if (e.key === 'Escape') {
    if (S.projOpen) { set({ projOpen: false }); return; }
    if (S.up && S.up.phase !== 'form') { if (S.up.phase !== 'run') A.upClose(); return; }
    if (S.menu) { var mt = document.querySelector('[data-act="menu"][data-v="' + S.menu + '"]'); set({ menu: null }); if (mt) mt.focus(); return; }
    if (S.adv) { cancelAdvance(); render(); return; }
    if (S.aiOpen) { A.aiClose(); return; }
    if (S.pchat && !S.sel) { A.pchatClose(); return; }
    if (S.planFull && !S.sel) { set({ planFull: false }); return; }
    if (S.fx && S.fx.phase !== 'run') set({ fx: null });
    else if (S.preview) set({ preview: null });
    else if (S.editEp) set({ editEp: false });
    else if (S.sel && !inField) set({ sel: null, compose: null });
    return;
  }
  if (inField) return;
  if (e.key === '/') { e.preventDefault(); var q = document.getElementById('q-lv'); if (q) q.focus(); return; }
  if (S.sel && !S.fx && !S.preview && (e.key === 'ArrowDown' || e.key === 'j')) { e.preventDefault(); A.nav({ v: 1 }); }
  if (S.sel && !S.fx && !S.preview && (e.key === 'ArrowUp' || e.key === 'k')) { e.preventDefault(); A.nav({ v: -1 }); }
});
// press-and-hold for confirmations that deviate more than 10 %
var holdT = null;
function endHold() { if (holdT) { clearTimeout(holdT); holdT = null; set({ holding: false }); } }
document.addEventListener('pointerdown', function (e) {
  var el = e.target.closest('[data-hold]'); if (!el) return;
  e.preventDefault();
  set({ holding: true });
  holdT = setTimeout(function () { holdT = null; confirmCurrent(); }, 1200);
});
document.addEventListener('pointerup', endHold);
document.addEventListener('pointercancel', endHold);
document.addEventListener('pointerout', function (e) {
  var btn = e.target.closest && e.target.closest('[data-hold]');
  if (btn && !(e.relatedTarget && btn.contains(e.relatedTarget))) endHold();
});

try { localStorage.removeItem('lvm-theme'); } catch (e) {}
['dragover', 'drop'].forEach(function (ev) {
  document.addEventListener(ev, function (e) {
    var z = e.target.closest && e.target.closest('[data-drop]');
    if (!z && !S.up) return;
    e.preventDefault();
    if (ev === 'drop' && z) takeFiles(e.dataTransfer.files);
  });
});
DEMO = { D: D, LVX: LVX, TOTAL: TOTAL, PLAN: PLAN, P: P, FLOORS: FLOORS, PLAN_VH: PLAN_VH };
var bootId = (/[#&]p=([^&]+)/.exec(location.hash) || [])[1];
if (bootId) {
  render();
  loadProject(decodeURIComponent(bootId)).catch(function (e) { A.home(); toast('Project ' + decodeURIComponent(bootId) + ' not loaded: ' + e.message); });
} else A.home();
})();
</script>
